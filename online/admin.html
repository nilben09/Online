<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Admin - Samson Polytechnic College</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo-area">

            <div class="school-logo">
                <div class="logo-circle">S</div>

                <div>
                    <h1>SAMSON</h1>
                    <p>POLYTECHNIC COLLEGE OF DAVAO</p>
                </div>
            </div>

        </div>

        <nav>
            <a href="index.html">← Back to Enrollment</a>
        </nav>

    </header>


    <!-- ================= ADMIN ================= -->

    <section
        class="admin-section"
        id="admin"
        style="padding-top: 110px; min-height: 80vh;"
    >

        <div class="admin-container">

            <div class="section-title">

                <h2>ENROLLMENT RECORDS</h2>

                <p>Admin access only.</p>

            </div>


            <!-- LOGIN -->

            <div
                id="adminLoginBox"
                style="max-width: 400px; margin: 0 auto 25px; text-align: left;"
            >

                <form id="adminLoginForm">

                    <div class="input-group">

                        <label>Admin Email</label>

                        <input
                            type="email"
                            id="adminEmail"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <div class="input-group" style="margin-top: 12px;">

                        <label>Password</label>

                        <input
                            type="password"
                            id="adminPassword"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <p
                        id="adminLoginError"
                        style="color: #c0392b; margin: 10px 0; display: none;"
                    ></p>

                    <button
                        type="submit"
                        id="adminLoginButton"
                        class="admin-button"
                        style="margin-top: 12px;"
                    >
                        ADMIN LOGIN
                    </button>

                </form>

            </div>


            <!-- RECORDS (shown after login) -->

            <div id="adminPanel" style="display: none;">

                <div class="admin-actions">

                    <button
                        type="button"
                        id="viewRecordsButton"
                        class="admin-button"
                    >
                        REFRESH RECORDS
                    </button>

                    <button
                        type="button"
                        id="backupButton"
                        class="admin-button"
                    >
                        DOWNLOAD BACKUP (CSV)
                    </button>

                    <button
                        type="button"
                        id="clearRecordsButton"
                        class="delete-button"
                    >
                        CLEAR RECORDS
                    </button>

                    <button
                        type="button"
                        id="logoutButton"
                        class="admin-button"
                    >
                        LOG OUT
                    </button>

                </div>

                <p
                    id="recordsCount"
                    style="text-align: center; margin: 15px 0;"
                ></p>

                <div
                    id="recordsContainer"
                    class="records-container"
                ></div>

            </div>

        </div>

    </section>


    <script type="module" src="admin.js"></script>

</body>
</html>
